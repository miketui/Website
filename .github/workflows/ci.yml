name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Static gates (audit · typecheck · lint · unit · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:audit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Live Stripe test-mode verification. Static checks cannot see a rotated
      # key or a price ID from the wrong account — the two documented causes of
      # the historical POST /api/checkout 502s. Skips cleanly when the secret
      # is absent (forks, Dependabot), so it never blocks an unprivileged PR.
      - name: Checkout smoke test (Stripe test mode)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_PRICE_ID_PREORDER: ${{ secrets.STRIPE_PRICE_ID_PREORDER_TEST }}
          STRIPE_PRICE_ID_REGULAR: ${{ secrets.STRIPE_PRICE_ID_REGULAR_TEST }}
          # Must match the name the smoke test reads. The script previously
          # read STRIPE_PRICE_ID_DAILY_DIRECTIVES while the application uses
          # ..._BUNDLE; because the var is optional, the wrong name read as
          # "not configured" and the $59 bundle price silently went unverified.
          STRIPE_PRICE_ID_DAILY_DIRECTIVES_BUNDLE: ${{ secrets.STRIPE_PRICE_ID_DAILY_DIRECTIVES_TEST }}
          STRIPE_PRICE_ID_WORKBOOK: ${{ secrets.STRIPE_PRICE_ID_WORKBOOK_TEST }}
        run: pnpm check:checkout
      - name: Persist production build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          # .next is a dot-directory: upload-artifact v4.4+ skips hidden files
          # by default and then "succeeds" having uploaded nothing.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next/
            !.next/cache/**
          retention-days: 1

  e2e-scroll:
    name: Scroll choreography (real-input Playwright)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep install and test on the same repository-local browser cache.
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: pnpm exec playwright install chromium --with-deps
      # Real wheel input only — synthetic scrollTo reads stale under headless
      # rAF throttling (docs/AUDIT-2026-07-02-ERROR-DOC.md addendum).
      - run: pnpm test:e2e
      - name: Upload playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility (axe-core · WCAG 2.1 AA)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: pnpm exec playwright install chromium --with-deps
      # Fails on serious/critical only; minor and moderate are logged.
      - run: pnpm test:a11y
      - name: Upload playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7
